<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Log in – Sport Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
<style>
/* แถบซ้ายของหน้า login: ใช้รูปแทนสีเขียวไล่เฉด (แสดงเมื่อจอกว้าง 1024px ขึ้นไป) */
@media (min-width:1024px) {
  .side {
    background:
      linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.7) 100%),
      url("image/login.png") center / cover no-repeat,
      linear-gradient(140deg, #064e3a, #0f766e);   /* สำรอง ถ้าไม่มีรูป */
  }
}
</style>
  <link rel="stylesheet" href="logo.css">
</head>

<body data-page="login">
    <div class="auth">
        <aside class="side" aria-hidden="true">
            <div>
                <h2>Find. Book. Play. Together.</h2>
                <p>Join thousands of players in your city.</p>
            </div>
        </aside>
        <main class="main">
            <div class="card">
                <a class="back" href="index.html">‹ Back</a>
                <a class="brand" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <path d="M3 3l18 18M21 3L3 21" />
                    </svg><span class="logo-text"><span class="logo-a">Sport</span><span class="logo-b">Hub</span></span></a>
                <h1>Welcome back</h1>
                <p class="sub">Log in to book courts and join matches</p>
                <form id="f">
                    <div class="f"><label for="id">Email or phone</label><input id="id" name="id" type="text"
                            autocomplete="username" placeholder="name@email.com" required></div>
                    <div class="f"><label for="pw">Password</label><input id="pw" name="pw" type="password"
                            autocomplete="current-password" placeholder="••••••••" required></div>
                    <div class="opts"><label><input type="checkbox" name="remember"> Remember me</label><a
                            href="#">Forgot password?</a></div>
                    <p class="err" id="err" role="alert"></p>
                    <button class="btn" type="submit">Log in</button>
                </form>
                <div class="or">or</div>
                <div class="alts"><button class="alt" type="button">Continue with LINE</button><button class="alt"
                        type="button">Continue with Google</button></div>
                <p class="switch">Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
